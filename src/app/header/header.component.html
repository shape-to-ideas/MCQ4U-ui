<div class="flex flex-row w-full justify-between px-4 sm:px-6 py-3 bg-white border-b border-primary-100 shadow-sm items-center sticky top-0 z-20">
    <div class="flex items-center gap-3">
        <button *ngIf="isLoggedIn" class="md:hidden p-2 -ml-2 rounded-lg text-primary hover:bg-primary-50 transition-colors"
                aria-label="Toggle menu" (click)="toggleSidebar()">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>
        <img src="black_pen_logo.png" class="w-20 sm:w-24 cursor-pointer" alt="favicon" (click)="redirectToHome()">
    </div>
    <div>
        <button class="px-3 py-1.5 sm:px-4 sm:py-2 text-xs sm:text-sm font-semibold rounded-lg border border-primary text-primary hover:bg-primary hover:text-white transition-colors"
                *ngIf="isLoggedIn" (click)="logOut()">Log Out</button>
    </div>
</div>
