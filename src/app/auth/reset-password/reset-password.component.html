<div class="flex justify-center items-center min-h-[80vh] px-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg border border-primary-100 p-8">
        <h1 class="flex w-full justify-center font-extrabold text-3xl text-primary mb-6">Reset Password</h1>

        <ng-container *ngIf="token; else invalidLink">
            <app-forms [formConfigs]="resetPasswordFormConfigs" (submitFormEvent)="submitResetPassword($event)"></app-forms>
        </ng-container>

        <ng-template #invalidLink>
            <p class="flex w-full justify-center my-5 text-primary-600">This reset link is invalid. Please request a new one.</p>
            <button class="w-full border border-primary text-primary rounded-lg p-2 my-5 font-bold hover:bg-primary hover:text-white transition-colors" (click)="navigateToForgotPassword()">Request New Link</button>
        </ng-template>
    </div>
</div>
