<div class="w-full px-4 sm:px-10 my-6 sm:my-10">
    <h2 class="mb-6 text-center text-2xl sm:text-3xl font-extrabold text-primary">{{ topicName }}</h2>
    <form *ngIf="questionsList.length && formGroup" [formGroup]="formGroup">
        <div formArrayName="question">
            <div class="flex flex-row w-full mb-4 bg-white border border-primary-100 rounded-xl shadow-sm p-4"
                 *ngFor="let question of attemptedQuestionFormArray?.controls; index as i"
                 [formGroupName]="i">
                <div class="flex pt-0.5 text-primary font-semibold">{{ i + 1 }}.</div>
                <div class="flex flex-col ml-4">
                    <p class="flex text-lg text-primary-800">{{ questionsList[i].title }}</p>
                    <div class="two-grid-layout">
                        <p class="text-sm text-primary-600" *ngFor="let option of questionsList[i].options">
                            {{ option.key }}.
                            <input type="radio" value="{{option.key}}" formControlName="attemptedOption" class="cursor-pointer accent-secondary-400">
                            {{ option.title }}
                        </p>
                    </div>
                    <div *ngIf="question.get(['attemptedOption'])?.touched">
                        <div class="text-sm text-red-500"
                             *ngIf="question.get(['attemptedOption'])?.hasError('required')">
                            This field is required
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="flex justify-between mt-5">
            <button class="rounded-lg p-2 bg-secondary text-primary-800 font-bold hover:bg-secondary-400 transition-colors" (click)="submitForm()">Submit
            </button>
        </div>
    </form>
    <div class="text-center w-full">
        <p-progressSpinner *ngIf="showLoader" ariaLabel="loading" />
    </div>
</div>
