<form *ngIf="formGroup" class="w-full" [formGroup]="formGroup">
    <div class="my-5" *ngFor="let formInput of formConfigs">

        <!--        FormArray-->
        <div *ngIf="formInput.isFormArray;else inputField" [formArrayName]="formInput.name"
             class="flex-row justify-center">
            <p class="mb-2 text-primary-700 font-medium">{{ formInput.name }}</p>
            <div *ngFor="let formArrayRoot of formInput.formArray; let i = index" class="flex items-center">
                <input class="rounded-lg p-2 border border-primary-200 w-full mb-3 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                       placeholder="{{ formArrayRoot.label }}"
                       *ngIf="[formTypes.INPUT, formTypes.PASSWORD].includes(formArrayRoot.type)"
                       formControlName="{{i}}" type="{{formArrayRoot.type}}">
                <textarea class="rounded-lg p-2 border border-primary-200 w-full mb-3 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                          *ngIf="[formTypes.TEXTAREA].includes(formArrayRoot.type)"
                          placeholder="{{ formArrayRoot.label }}"
                          formControlName="{{i}}"></textarea>
            </div>
        </div>

        <!--        Normal Fields-->
        <ng-template #inputField>
            <label *ngIf="[''].includes(formInput.type)"
                   class="text-base text-primary-700 font-medium"
                   for="{{formInput.name}}">{{ formInput.label }}: </label>
            <input class="{{formInput.className ? formInput.className : 'w-full p-2 rounded-lg border border-primary-200 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent'}}"
                   *ngIf="[formTypes.INPUT, formTypes.PASSWORD].includes(formInput.type)"
                   placeholder="{{formInput.label}}"
                   formControlName="{{formInput.name}}" type="{{formInput.type}}">

            <textarea class="rounded-lg border border-primary-200 w-full p-2 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                      *ngIf="[formTypes.TEXTAREA].includes(formInput.type)"
                      formControlName="{{formInput.name}}"></textarea>
        </ng-template>
        <div *ngFor="let validation of formInput.validations">
            <div *ngIf="formGroup.controls[formInput.name].invalid && formGroup.controls[formInput.name].touched"
                 class="alert">
                <div class="text-sm text-red-500"
                     *ngIf="formGroup.controls[formInput.name].hasError(validation.name.toLowerCase())">
                    {{ validation.errorMessage }}
                </div>
            </div>
        </div>
    </div>
    <div *ngFor="let formInput of formConfigs">
        <button *ngIf="formInput.type === formTypes.SUBMIT_BUTTON"
                class="w-full p-2 rounded-lg bg-secondary text-primary-800 font-bold hover:bg-secondary-400 transition-colors"
                (click)="submitForm()">{{ formInput.label }}
        </button>
    </div>
</form>
